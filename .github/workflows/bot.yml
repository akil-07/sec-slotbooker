name: 🤖 Saveetha Unified Bot (OTP + Slot Booking)

on:
  workflow_dispatch:

concurrency:
  group: "saveetha-unified-bot"
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:

  # ── Unified Bot Job (Slot Booking + Schedule + OTP Attendance) ─────────────
  bot:
    name: Saveetha Unified Bot
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloud-bot/package-lock.json

      - name: Install dependencies
        run: cd cloud-bot && npm install

      - name: Install Playwright + Chromium
        run: cd cloud-bot && npx playwright install chromium --with-deps

      - name: Run Saveetha Bot
        env:
          SAVEETHA_USER: ${{ secrets.SAVEETHA_USER }}
          SAVEETHA_PASS: ${{ secrets.SAVEETHA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPER_ADMIN_NOTIFICATIONS: ${{ secrets.SUPER_ADMIN_NOTIFICATIONS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
          TZ: Asia/Kolkata
        run: |
          cd cloud-bot
          timeout 19800 node book-only.js || true
          echo "Bot session ended."

  # ── Self-restart ───────────────────────────────────────────────────────────
  restart:
    name: Trigger Next Run
    runs-on: ubuntu-24.04
    needs: [bot]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "cloud-bot/STOP_BOT" ]; then
            echo "STOP_BOT flag found. Not restarting."
          else
            echo "Session finished. Restarting workflow..."
            gh workflow run bot.yml
          fi

