name: Saveetha Bots (OTP + Slot Booking)

on:
  workflow_dispatch:

concurrency:
  group: "saveetha-bots"
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:

  # ── Job 1: Schedule OTP Bot ────────────────────────────────────────────────
  otp-bot:
    name: Schedule OTP Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloud-bot/package-lock.json

      - name: Install dependencies
        run: cd cloud-bot && npm install

      - name: Install Playwright + Chromium
        run: cd cloud-bot && npx playwright install chromium --with-deps

      - name: Run Schedule OTP Bot
        env:
          SAVEETHA_USER: ${{ secrets.SAVEETHA_USER }}
          SAVEETHA_PASS: ${{ secrets.SAVEETHA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TZ: Asia/Kolkata
        run: |
          cd cloud-bot
          timeout 19800 node schedule-otp-bot.js || true
          echo "OTP bot session ended."

  # ── Job 2: Slot Booking Bot ────────────────────────────────────────────────
  booking-bot:
    name: Slot Booking Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloud-bot/package-lock.json

      - name: Install dependencies
        run: cd cloud-bot && npm install

      - name: Install Playwright + Chromium
        run: cd cloud-bot && npx playwright install chromium --with-deps

      - name: Run Slot Booking Bot
        env:
          SAVEETHA_USER: ${{ secrets.SAVEETHA_USER }}
          SAVEETHA_PASS: ${{ secrets.SAVEETHA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPER_ADMIN_NOTIFICATIONS: ${{ secrets.SUPER_ADMIN_NOTIFICATIONS }}
          TZ: Asia/Kolkata
        run: |
          cd cloud-bot
          timeout 19800 node book-only.js || true
          echo "Slot booking bot session ended."

  # ── Job 3: Self-restart (waits for BOTH bots to finish) ───────────────────
  restart:
    name: Trigger Next Run
    runs-on: ubuntu-latest
    needs: [otp-bot, booking-bot]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "cloud-bot/STOP_BOT" ]; then
            echo "STOP_BOT flag found. Not restarting."
          else
            echo "Both bots finished. Restarting workflow..."
            gh workflow run bot.yml
          fi
