name: 🤖 Saveetha Telegram Bot (Persistent)

on:
  workflow_dispatch:   # Manual start from GitHub UI or Telegram
  schedule:
    - cron: '0 */5 * * *'   # Auto-restart every 5 hours (before GitHub's 6h limit kills it)

jobs:
  bot:
    name: Run Persistent Telegram Bot
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ~5h 40min — safely under GitHub's 6h limit

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloud-bot/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd cloud-bot
          npm install

      - name: 🎭 Install Playwright + Chromium
        run: |
          cd cloud-bot
          npx playwright install chromium --with-deps

      - name: 🤖 Run Persistent Telegram Bot (up to 5.5 hours)
        env:
          SAVEETHA_USER: ${{ secrets.SAVEETHA_USER }}
          SAVEETHA_PASS: ${{ secrets.SAVEETHA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cd cloud-bot
          node book-only.js &
          BOT_PID=$!
          echo "Bot running with PID $BOT_PID"
          # Run for 5.5 hours (19800 seconds), then gracefully stop
          sleep 19800
          echo "Time limit reached — stopping bot gracefully."
          kill $BOT_PID 2>/dev/null || true
