name: 🤖 Saveetha Telegram Bot (Persistent)

on:
  workflow_dispatch:   # Manual start from GitHub UI or Telegram only

concurrency:
  group: "telegram-bot"
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  bot:
    name: Run Persistent Telegram Bot
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours max per run

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloud-bot/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd cloud-bot
          npm install

      - name: 🎭 Install Playwright + Chromium
        run: |
          cd cloud-bot
          npx playwright install chromium --with-deps

      - name: 🤖 Run Telegram Bot
        env:
          SAVEETHA_USER: ${{ secrets.SAVEETHA_USER }}
          SAVEETHA_PASS: ${{ secrets.SAVEETHA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TZ: Asia/Kolkata
        run: |
          cd cloud-bot
          # Run for up to 5.5 hours (19800 seconds)
          timeout 19800 node book-only.js || true
          echo "Bot session ended."
