<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyCamu Auto Enroller</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #0a0a0a;
      --border-color: #222222;
      --border-focus: #444444;
      --text-main: #ededed;
      --text-muted: #888888;
      --accent: #ffffff;
      --success: #3b82f6; /* A clean professional blue */
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      width: 320px;
      background: var(--bg-base);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      padding: 24px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-surface);
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: var(--text-main);
      color: var(--bg-base);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    /* ─── Container ─── */
    .container {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─── Form Fields ─── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .optional-tag {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      box-sizing: border-box;
      transition: border-color 0.15s ease;
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--border-focus);
    }
    
    textarea::placeholder, input[type="text"]::placeholder {
      color: #555555;
    }

    .field-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ─── Tags ─── */
    .target-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .target-tag {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    /* ─── Premium Switch ─── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .toggle-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    
    .toggle-desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #222;
      transition: .2s;
      border-radius: 24px;
      border: 1px solid #333;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #888;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: var(--bg-base);
    }

    /* ─── Status Bar ─── */
    .status-bar {
      margin: 0 20px 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      transition: background 0.2s ease;
    }

    .status-bar.active {
      border-color: #333;
      color: var(--text-main);
    }

    .status-bar.active .status-dot {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .status-bar.success {
      border-color: rgba(59, 130, 246, 0.3);
      background: rgba(59, 130, 246, 0.05);
      color: var(--success);
    }
    
    .status-bar.success .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
      animation: none;
    }

  </style>
</head>
<body>
  
  <div class="header">
    <div class="header-icon">MC</div>
    <div class="header-title">
      <h2>Auto Enroller</h2>
      <div class="subtitle">Saveetha Portal Automation</div>
    </div>
  </div>

  <div class="container">
    
    <div class="field-group">
      <label>Target Courses <span class="optional-tag">Comma separated</span></label>
      <textarea id="courseInput" placeholder="Digital Forensics, Web Data Mining"></textarea>
      <div id="targetList" class="target-list"></div>
    </div>
    
    <div class="field-group">
      <label>Section Filter <span class="optional-tag">Optional</span></label>
      <input type="text" id="sectionInput" placeholder="UG - 04">
    </div>
    
    <div class="field-group">
      <label>Bulk Timetable Paste</label>
      <div class="field-desc">Format: Course Name | Section (one per line)</div>
      <textarea id="bulkInput" placeholder="Generative AI | UG - 10"></textarea>
    </div>

    <div class="toggle-row">
      <div class="toggle-label">
        <span class="toggle-title">Enable Automation</span>
        <span class="toggle-desc">Automatically scans and enrolls</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoEnrollCheck">
        <span class="slider"></span>
      </label>
    </div>
    
  </div>
  
  <div class="status-bar" id="statusText">
    <div class="status-dot"></div>
    <span id="statusMsg">System Idle</span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
