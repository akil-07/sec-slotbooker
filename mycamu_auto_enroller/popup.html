<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyCamu Auto Enroller</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff3333;
      --primary-glow: rgba(255, 51, 51, 0.6);
      --bg-color: #050505;
      --surface: rgba(25, 25, 25, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #8892b0;
      --success: #00ff88;
      --success-glow: rgba(0, 255, 136, 0.4);
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      width: 340px;
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 100% 0%, rgba(255, 51, 51, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(0, 255, 136, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 480px;
    }

    /* ─── Header ─── */
    .header {
      padding: 25px 20px 20px;
      text-align: center;
      position: relative;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), #ff8800);
      border-radius: 12px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 20px var(--primary-glow);
      position: relative;
    }
    
    .header-icon::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), transparent);
      z-index: -1;
      animation: pulse-border 2s linear infinite;
    }

    @keyframes pulse-border {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #ffffff, #a3a3a3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ─── Container & Glass Cards ─── */
    .container {
      padding: 0 16px 16px;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--surface-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.4;
      font-weight: 300;
    }

    /* ─── Inputs ─── */
    textarea, .styled-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      box-sizing: border-box;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
      line-height: 1.5;
    }

    textarea:focus, .styled-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px rgba(255, 51, 51, 0.15);
    }
    
    textarea::placeholder, .styled-input::placeholder {
      color: #4b5563;
      font-family: 'Outfit', sans-serif;
    }

    /* ─── Tags ─── */
    .target-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .target-tag {
      background: rgba(255, 51, 51, 0.1);
      border: 1px solid rgba(255, 51, 51, 0.3);
      color: #ff6666;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      display: inline-flex;
      align-items: center;
    }

    @keyframes popIn {
      from { transform: scale(0.8) translateY(5px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* ─── Premium Switch ─── */
    .arm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(145deg, rgba(20,20,20,0.8), rgba(10,10,10,0.9));
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      margin-bottom: 16px;
    }

    .arm-label {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2a2a2a;
      transition: .4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 30px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background: linear-gradient(180deg, #e0e0e0, #999);
      transition: .4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4), inset 0 1px 1px #fff;
    }

    input:checked + .slider {
      background-color: #3a1010;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,51,51,0.3);
    }

    input:checked + .slider:before {
      transform: translateX(26px);
      background: linear-gradient(180deg, #ff6666, var(--primary));
      box-shadow: 0 0 12px var(--primary-glow), inset 0 1px 1px rgba(255,255,255,0.6);
    }

    /* ─── Status Bar ─── */
    .status-bar {
      margin: 0 16px 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .status-bar.active {
      background: rgba(255, 51, 51, 0.05);
      border: 1px solid rgba(255, 51, 51, 0.3);
      color: #ff3333;
      box-shadow: inset 0 0 15px rgba(255, 51, 51, 0.1);
    }

    .status-bar.active::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 51, 51, 0.25), transparent);
      animation: laser-scan 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    
    @keyframes laser-scan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .status-bar.active #statusMsg {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px;
      animation: text-pulse 1s infinite alternate;
    }

    @keyframes text-pulse {
      0% { opacity: 0.7; text-shadow: none; }
      100% { opacity: 1; text-shadow: 0 0 8px rgba(255,51,51,0.8); }
    }

    .status-bar.success {
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.2);
      color: var(--success);
    }
    
    .radar {
      position: relative;
      width: 14px;
      height: 14px;
      display: none;
    }
    
    .status-bar.active .radar {
      display: block;
    }

    .radar::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid var(--primary);
      border-radius: 50%;
      opacity: 0;
      animation: radar-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    
    .radar::after {
      content: '';
      position: absolute;
      inset: 4px;
      background: var(--primary);
      border-radius: 50%;
    }

    @keyframes radar-ping {
      75%, 100% { transform: scale(2.5); opacity: 0; }
    }

  </style>
</head>
<body>
  
  <div class="header">
    <div class="header-icon">🎯</div>
    <h2>MyCamu Auto Enroller</h2>
    <div class="subtitle">Sniper Module</div>
  </div>

  <div class="container">
    
    <div class="arm-row">
      <div class="arm-label">System Armed</div>
      <label class="switch">
        <input type="checkbox" id="autoEnrollCheck">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <div class="field">
        <label>Target Courses 
          <span style="font-weight:400; font-size:10px; color:#6b7280">Comma separated</span>
        </label>
        <textarea id="courseInput" placeholder="e.g. Generative AI, Web Data Mining"></textarea>
        <div id="targetList" class="target-list"></div>
      </div>
      
      <div class="field" style="margin-top:20px;">
        <label>Section Filter <span style="font-weight:400; font-size:10px; color:#6b7280">Optional</span></label>
        <input type="text" id="sectionInput" placeholder="e.g. UG - 04" class="styled-input">
      </div>
    </div>
    
    <div class="card">
      <div class="field">
        <label>Bulk Timetable Paste</label>
        <div class="desc">Format: <b>Course Name | Section</b> (one per line)</div>
        <textarea id="bulkInput" placeholder="Course A | UG - 10&#10;Course B | UG - 11"></textarea>
      </div>
    </div>
    
  </div>
  
  <div class="status-bar" id="statusText">
    <div class="radar"></div>
    <span id="statusMsg">System Idle — Waiting for targets</span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
