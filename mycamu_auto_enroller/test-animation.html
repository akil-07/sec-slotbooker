<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sniper Animation Test</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .target-card {
            background: #141b2d;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .target-card h2 {
            margin-top: 0;
            color: #f8fafc;
        }

        .target-card p {
            color: #94a3b8;
        }

        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }

        #trigger-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff4500;
        }

        /* --- Copied Animation Styles from content.js --- */
        @keyframes rippleOut {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        @keyframes shootRecoil {
            0% { transform: translate(-50%, -50%) scale(1); }
            20% { transform: translate(-50%, -50%) scale(1.4) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        @keyframes flashEffect {
            0% { background: rgba(255, 69, 0, 0.4); }
            100% { background: transparent; }
        }
        .sniper-crosshair {
            position: fixed;
            width: 50px;
            height: 50px;
            z-index: 9999999;
            pointer-events: none;
            top: 50%;
            left: 50%;
            transition: top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), left 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s;
            opacity: 0;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8));
        }
        .sniper-line-v { position: absolute; top: -10px; bottom: -10px; left: 50%; width: 2px; background: red; transform: translateX(-50%); }
        .sniper-line-h { position: absolute; left: -10px; right: -10px; top: 50%; height: 2px; background: red; transform: translateY(-50%); }
        .sniper-circle { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 2px solid red; border-radius: 50%; }
        .sniper-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: red; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 8px red; }
    </style>
</head>
<body>

    <button id="trigger-btn">Run Snipe Test</button>

    <div class="target-card">
        <h2>Web Data Mining</h2>
        <p>Section: UG - 12</p>
        <button id="enroll-btn">Enroll Now</button>
    </div>

    <!-- The fake cursor -->
    <div id="fakeCursor" class="sniper-crosshair">
        <div class="sniper-line-v"></div>
        <div class="sniper-line-h"></div>
        <div class="sniper-circle"></div>
        <div class="sniper-dot"></div>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const enrollBtn = document.getElementById('enroll-btn');
        const fakeCursor = document.getElementById('fakeCursor');

        triggerBtn.addEventListener('click', () => {
            // Reset position to somewhere off-center
            fakeCursor.style.transition = 'none';
            fakeCursor.style.left = '10%';
            fakeCursor.style.top = '10%';
            fakeCursor.style.opacity = '1';
            
            // Force reflow
            void fakeCursor.offsetWidth;

            // Glide to the button
            fakeCursor.style.transition = 'top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), left 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s';
            
            const rect = enrollBtn.getBoundingClientRect();
            const exactX = Math.round(rect.left + rect.width / 2);
            const exactY = Math.round(rect.top + rect.height / 2);

            fakeCursor.style.left = exactX + 'px';
            fakeCursor.style.top = exactY + 'px';

            // Wait for glide to finish, then SHOOT
            setTimeout(() => {
                // 1. Screen Flash
                const flash = document.createElement('div');
                flash.style.cssText = `position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 69, 0, 0.3); z-index: 9999997; pointer-events: none; animation: flashEffect 0.2s ease-out forwards;`;
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 200);

                // 2. Crosshair Recoil
                fakeCursor.style.animation = 'shootRecoil 0.2s ease-out';
                setTimeout(() => { fakeCursor.style.animation = ''; }, 200);

                // 3. Bullet Hole / Blast Ripple
                const ripple = document.createElement('div');
                ripple.style.cssText = `position: fixed; left: ${exactX - 25}px; top: ${exactY - 25}px; width: 50px; height: 50px; background: radial-gradient(circle, rgba(255,200,0,1) 0%, rgba(255,0,0,0.8) 40%, rgba(0,0,0,0) 70%); border-radius: 50%; z-index: 9999998; pointer-events: none; animation: rippleOut 0.5s ease-out forwards;`;
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);

                // Change button text to show it was clicked
                enrollBtn.innerText = 'Enrolled! 🎯';
                enrollBtn.style.background = '#475569';
                
                // Hide cursor after a delay
                setTimeout(() => {
                    fakeCursor.style.opacity = '0';
                    setTimeout(() => {
                        enrollBtn.innerText = 'Enroll Now';
                        enrollBtn.style.background = '#10b981';
                    }, 1000);
                }, 600);

            }, 400); // 400ms is the glide duration
        });
    </script>
</body>
</html>
